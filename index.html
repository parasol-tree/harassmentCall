<script>
  ;(function () {
    const schemeRes = window.matchMedia('(prefers-color-scheme: light)')
    function setHtmlClassByTheme(isMatches) {
      if (isMatches) {
        sessionStorage.setItem('colorScheme', 'light')
        document.documentElement.classList.add('light')
        document.documentElement.classList.remove('dark')
      } else {
        sessionStorage.setItem('colorScheme', 'dark')
        document.documentElement.classList.add('dark')
        document.documentElement.classList.remove('light')
      }
    }
    setHtmlClassByTheme(schemeRes.matches)
    schemeRes.addEventListener('change', (e) => {
      setHtmlClassByTheme(e.target.matches)
      const colorSchemeChange = new CustomEvent('colorSchemeChange', {
        detail: {
          matches: schemeRes.matches,
          colorScheme: schemeRes.matches ? 'light' : 'dark',
        },
      })
      window.dispatchEvent(colorSchemeChange)
    })
  })()
</script>
